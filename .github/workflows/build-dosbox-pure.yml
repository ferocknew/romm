name: Build DOSBox Pure WASM Core

on:
  push:
    tags:
      - "test-*"

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/test-}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4.3.0

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Clone DOSBox Pure 1.0-preview5
        run: |
          git clone https://github.com/schellingb/dosbox-pure.git --branch 1.0-preview5 --depth 1 ~/dosbox-pure

      - name: Patch Makefile for emscripten
        working-directory: /home/runner/dosbox-pure
        run: |
          patch -p0 < "${{ github.workspace }}/.github/dosbox-pure-emscripten.patch"

      - name: Build DOSBox Pure bitcode
        working-directory: /home/runner/dosbox-pure
        run: |
          source ~/emsdk/emsdk_env.sh
          emmake make platform=emscripten -j$(nproc)

      - name: Clone EmulatorJS RetroArch
        run: |
          git clone https://github.com/EmulatorJS/RetroArch.git --branch next --depth 1 ~/retroarch

      - name: Link WASM core
        working-directory: /home/runner/retroarch/emulatorjs
        run: |
          source ~/emsdk/emsdk_env.sh
          cp /home/runner/dosbox-pure/dosbox_pure_libretro_emscripten.bc ./
          emmake ./build-emulatorjs.sh --threads

      - name: Copy WASM core to Docker context
        run: |
          mkdir -p docker/dosbox-pure
          cp ~/EmulatorJS/data/cores/dosbox_pure-thread-wasm.data docker/dosbox-pure/
          ls -la docker/dosbox-pure/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          file: docker/Dockerfile
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/romm-test:${{ steps.version.outputs.VERSION }}
          target: full-image

      - name: Upload WASM core artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dosbox-pure-wasm-${{ steps.version.outputs.VERSION }}
          path: docker/dosbox-pure/
          retention-days: 30
